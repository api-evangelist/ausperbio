aid: ausperbio
name: AusperBio
description: 'AusperBio — AusperBio Therapeutics, Inc. in the United States and Ausper
  Biopharma Co., Ltd. (杭州浩博医药有限公司) in Hangzhou, China — is a clinical-stage
  biopharmaceutical company founded in 2019 that develops oligonucleotide and targeted
  delivery technologies, with an initial focus on achieving a functional cure for chronic
  hepatitis B infection. Its proprietary Med-Oligo antisense oligonucleotide (ASO) platform
  pairs novel ASO design and optimization with targeted delivery conjugation chemistry,
  and its Au-HALO hepatocyte-targeting delivery technology extends the same modular
  approach to siRNA. The lead candidate AHB-137 is an unconjugated ASO that completed
  enrollment in two Phase II trials and received China CDE clearance to enter Phase III;
  a second clinical candidate, AHB-171, is a hepatocyte-targeted siRNA. The company has
  raised more than $200M across Series B, B+ and B2 rounds from investors including
  Qiming Venture Partners, HanKang Capital, CDH Investments, Sherpa Capital, YuanBio
  Venture Capital and Genesis Capital. AusperBio sells therapeutics, not software: it
  publishes no developer program, no public API, no SDK and no machine-readable API
  contract. Its only machine-readable surface is the private Spring Boot CMS backend that
  renders ausperbio.com, whose springdoc API description is correctly locked behind
  authentication.'
